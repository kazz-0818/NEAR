# main への push / PR でビルド検証。Render は commit トリガーで push 直後にデプロイ（このジョブ完了を待たない）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# デフォルト GITHUB_TOKEN の権限を明示（組織ポリシーでブロックされにくくする）
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      LINE_CHANNEL_SECRET: ci-line-channel-secret-placeholder
      LINE_CHANNEL_ACCESS_TOKEN: ci-line-channel-access-token-placeholder
      OPENAI_API_KEY: sk-ci-openai-placeholder
      ADMIN_API_KEY: ci-admin-api-key-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Veriora cross-repo sync
        run: npm run verify:veriora-sync
