# main への push / PR でビルド検証。Render は commit トリガーで push 直後にデプロイ（このジョブ完了を待たない）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      LINE_CHANNEL_SECRET: ci-line-channel-secret-placeholder
      LINE_CHANNEL_ACCESS_TOKEN: ci-line-channel-access-token-placeholder
      OPENAI_API_KEY: sk-ci-openai-placeholder
      ADMIN_API_KEY: ci-admin-api-key-placeholder
    defaults:
      run:
        working-directory: NEAR
    steps:
      # 横断 verify 用: workspace 直下に NEAR + 兄弟（同一 org の private リポは VERIORA_ORG_CHECKOUT_TOKEN 推奨）
      - uses: actions/checkout@v4
        with:
          path: NEAR

      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: kazz-0818/SERA
          path: SERA
          token: ${{ secrets.VERIORA_ORG_CHECKOUT_TOKEN || github.token }}

      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: kazz-0818/IRIE
          path: IRIE
          token: ${{ secrets.VERIORA_ORG_CHECKOUT_TOKEN || github.token }}

      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: kazz-0818/RITS
          path: RITS
          token: ${{ secrets.VERIORA_ORG_CHECKOUT_TOKEN || github.token }}

      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: kazz-0818/LRAM
          path: LRAM
          token: ${{ secrets.VERIORA_ORG_CHECKOUT_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: NEAR/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Veliora cross-repo sync
        run: npm run verify:veriora-sync

      - name: Vegapunk static verify
        run: npm run verify:vegapunk-static
