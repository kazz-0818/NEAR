# Veriora ショーケース（site/）を GitHub Pages へ公開
# 有効化: リポジトリ Settings → Pages → Source: GitHub Actions
# 公開 URL（既定）: https://<user>.github.io/NEAR/

name: Deploy Veriora site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-veriora-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-veriora-site"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install and build
        env:
          GITHUB_PAGES: "true"
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
