# NEAR Growth Automation v2（STEP2）
#
# 確認用チェックリスト（実装は scripts/near-growth-cursor-agent.sh）:
# - トリガー: issues.opened / issues.labeled
# - 実行ラベル: near-growth + cursor-agent / スキップ: near-growth-pr-created / near-growth-agent-running
# - 処理中: near-growth-agent-running を付与し、終了時（成功・失敗・差分なし）に必ず除去
# - Secrets: CURSOR_API_KEY（ログに出さない）
# - Cursor CLI: install + agent -p --force --trust
#
# 必要な Secrets:
#   CURSOR_API_KEY … https://cursor.com/docs/cli/github-actions
# GITHUB_TOKEN は github.token（permissions 参照）
#
# 同一 Issue で再テストするとき:
# - near-growth-agent-running / near-growth-agent-failed を外す
# - cursor-agent ラベルを外して付け直す（labeled で再実行）

name: NEAR Growth Cursor Agent

on:
  issues:
    types: [opened, labeled]

concurrency:
  group: near-growth-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cursor-agent:
    # issues のみ・fork 除外・PR 連動 Issue 除外
    # near-growth + cursor-agent が付いているときだけジョブ実行（runner 節約）
    # near-growth-pr-created が付いている Issue はジョブ自体をスキップ（詳細は scripts/near-growth-cursor-agent.sh でも再確認）
    if: ${{ github.event_name == 'issues' && !github.event.repository.fork && !github.event.issue.pull_request && contains(format('|{0}|', join(github.event.issue.labels.*.name, '|')), '|near-growth|') && contains(format('|{0}|', join(github.event.issue.labels.*.name, '|')), '|cursor-agent|') && !contains(format('|{0}|', join(github.event.issue.labels.*.name, '|')), '|near-growth-pr-created|') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: NEAR Growth — Cursor Agent & PR
        shell: bash
        run: bash scripts/near-growth-cursor-agent.sh
