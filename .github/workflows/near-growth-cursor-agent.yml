# NEAR Growth Automation v2.2（STEP2）
#
# 確認用チェックリスト（実装は scripts/near-growth-cursor-agent.sh）:
# - トリガー: issues.labeled のみ（opened との二重起動を避ける）
# - 実行ラベル（いずれか）:
#     · near-growth-smoke-test … README のみ変更・Cursor Agent なし（PR 経路のスモーク）
#     · near-growth + cursor-agent … 通常（Cursor CLI / agent）
# - スキップ: near-growth-pr-created / near-growth-agent-running
# - 処理中: near-growth-agent-running を付与し、終了時（成功・失敗・差分なし）に必ず除去
# - Secrets: CURSOR_API_KEY（スモークでは未使用・通常フローのみ）
# - Cursor CLI: 通常フローのみ install + agent -p --force --trust
#
# 必要な Secrets:
#   CURSOR_API_KEY … https://cursor.com/docs/cli/github-actions（通常フロー）
# PR 作成について:
#   既定の github.token だけでは「GitHub Actions is not permitted to create pull requests」と拒否される
#   リポジトリがあることがあります。その場合は次のいずれか。
#   A) Settings → Actions → General → Workflow permissions で
#      「Allow GitHub Actions to create and approve pull requests」を有効にする
#   B)  classic PAT（repo スコープ）を Secrets に NEAR_GROWTH_ACTIONS_GH_TOKEN として登録する（下記 env）
#
# GH_TOKEN: 未設定なら github.token、設定時は PAT（gh / git push に利用）
#
# 同一 Issue で再テストするとき（トリガーは labeled のみ）:
# - pr-created / running / failed ラベルを必要に応じて外す
# - 通常: near-growth または cursor-agent を一度外して付け直す
# - スモーク: near-growth-smoke-test を一度外して付け直す
#
# スモークテスト手順（PR 経路のみ確認・Cursor Agent なし）:
# - Issue に near-growth-smoke-test ラベルを付ける
# - Actions が起動する → README.md が更新される → PR 作成 → Issue に PR URL コメント

name: NEAR Growth Cursor Agent

on:
  issues:
    types: [labeled]

# 同一 Issue のワークフローは直列化（二重インストール・二重 agent を避ける）
concurrency:
  group: near-growth-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cursor-agent:
    # fork 除外・PR 連動 Issue 除外・スモーク OR (near-growth+cursor-agent)・完了/実行中ラベルでジョブスキップ
    if: ${{ github.event_name == 'issues' && !github.event.repository.fork && !github.event.issue.pull_request && !contains(format('|{0}|', join(github.event.issue.labels.*.name, '|')), '|near-growth-pr-created|') && !contains(format('|{0}|', join(github.event.issue.labels.*.name, '|')), '|near-growth-agent-running|') && (contains(format('|{0}|', join(github.event.issue.labels.*.name, '|')), '|near-growth-smoke-test|') || (contains(format('|{0}|', join(github.event.issue.labels.*.name, '|')), '|near-growth|') && contains(format('|{0}|', join(github.event.issue.labels.*.name, '|')), '|cursor-agent|'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ secrets.NEAR_GROWTH_ACTIONS_GH_TOKEN || github.token }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: NEAR Growth — Cursor Agent & PR
        shell: bash
        run: bash scripts/near-growth-cursor-agent.sh
