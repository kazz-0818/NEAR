# NEAR Growth Automation v2（STEP2）
#
# 確認用チェックリスト（実装は scripts/near-growth-cursor-agent.sh）:
# - トリガー: issues.labeled のみ（opened との二重起動を避ける）
# - 実行ラベル: near-growth + cursor-agent / スキップ: near-growth-pr-created / near-growth-agent-running
# - 処理中: near-growth-agent-running を付与し、終了時（成功・失敗・差分なし）に必ず除去
# - Secrets: CURSOR_API_KEY（ログに出さない）
# - Cursor CLI: install + agent -p --force --trust
#
# 必要な Secrets:
#   CURSOR_API_KEY … https://cursor.com/docs/cli/github-actions
# GITHUB_TOKEN は github.token（permissions 参照）
#
# 同一 Issue で再テストするとき（トリガーは labeled のみ）:
# - pr-created / running / failed ラベルを必要に応じて外す
# - near-growth または cursor-agent を外して付け直す

name: NEAR Growth Cursor Agent

on:
  issues:
    types: [labeled]

# 同一 Issue のワークフローは直列化（二重インストール・二重 agent を避ける）
concurrency:
  group: near-growth-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cursor-agent:
    # fork 除外・PR 連動 Issue 除外・必須ラベルのみ・完了・実行中はジョブ自体をスキップ（running 付与で発火した labeled もここで除外）
    if: ${{ github.event_name == 'issues' && !github.event.repository.fork && !github.event.issue.pull_request && contains(format('|{0}|', join(github.event.issue.labels.*.name, '|')), '|near-growth|') && contains(format('|{0}|', join(github.event.issue.labels.*.name, '|')), '|cursor-agent|') && !contains(format('|{0}|', join(github.event.issue.labels.*.name, '|')), '|near-growth-pr-created|') && !contains(format('|{0}|', join(github.event.issue.labels.*.name, '|')), '|near-growth-agent-running|') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: NEAR Growth — Cursor Agent & PR
        shell: bash
        run: bash scripts/near-growth-cursor-agent.sh
