# Render Blueprint: https://render.com/docs/blueprint-spec
#
# デプロイ後:
# - ブラウザでルート https://<サービス名>.onrender.com/ を開くと、公開 URL・/health・Render ダッシュボードへのリンクが表示されます。
# - Render が自動で付与: RENDER_EXTERNAL_URL, RENDER_SERVICE_ID, RENDER=true など（手動設定不要）
# - PUBLIC_BASE_URL は任意。未設定でも RENDER_EXTERNAL_URL を通知・/health で利用します。
# 秘密（DATABASE_URL, LINE_*, OPENAI_*, ADMIN_API_KEY 等）はダッシュボードの Environment で設定してください。

services:
  - type: web
    name: near
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # main へ push したら即自動デプロイ（CI 成否を待たない）。品質ゲートは CI ログで確認。
    branch: main
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production

  # Web がスリープ中でも毎分 wake + リマインド送信（NEAR_PUBLIC_URL は本番 URL）
  # VELIORA_WAKE_URLS: 兄弟サービスも同時に wake して LINE Webhook のコールドスリープ無返信を防ぐ。
  # 注意: 無料プランの Web を常時ウォームに保つと Render の無料インスタンス時間を消費し続ける。
  #       上限が気になる場合はこのリストを削るか、対象サービスを starter に上げること。
  - type: cron
    name: near-reminder-dispatch
    runtime: docker
    dockerfilePath: ./Dockerfile.reminder-cron
    schedule: "* * * * *"
    envVars:
      - key: NEAR_PUBLIC_URL
        value: https://near-5kyl.onrender.com
      - key: CRON_SECRET
        sync: false
      - key: VELIORA_WAKE_URLS
        value: https://sera-zsuf.onrender.com/health,https://lira-ofkv.onrender.com/health,https://rits-gj2m.onrender.com/health,https://lram.onrender.com/health
